name: リリース用ビルド

# タグ v1.0.0 のように push されたら .app を固めて Release に添付する。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    # Release を作るには書き込み権限が要る。
    # 既定の GITHUB_TOKEN は読み取りのみなので明示する。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: バージョンを確認
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          echo "タグ: $TAG / Info.plist: $PLIST_VERSION"
          if [ -n "$TAG" ] && [ "$TAG" != "$PLIST_VERSION" ]; then
            echo "::error::タグ($TAG) と Info.plist($PLIST_VERSION) のバージョンが一致しません"
            exit 1
          fi

      - name: ビルド
        run: ./build.sh

      - name: zip に固める
        run: |
          cd build
          # 添付ファイル名は ASCII にする。GitHub はリリース添付の名前から
          # 非 ASCII 文字を落とすため、日本語名だと "-v1.0.0.zip" になってしまう。
          zip -r -y "../MacTaskManager-${GITHUB_REF_NAME}.zip" "MacTaskManager.app"

      - name: Release に添付
        uses: softprops/action-gh-release@v2
        with:
          files: MacTaskManager-*.zip
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
